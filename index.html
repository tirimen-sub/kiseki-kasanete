<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キセキ・カサネテ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-container">
            <div class="loading-text">ロード中...</div>
            <div id="loading-message" class="loading-message">初期化中...</div>
            <div id="loading-detail" class="loading-detail">移動ログを読み込んでいます...</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="loading-percent" class="loading-percent">0%</div>
        </div>
    </div>

        <button id="help-button" type="button" aria-label="操作説明を開く">?</button>
    <button id="theme-toggle-button" type="button" aria-label="ライトモードに切り替え">☀</button>
    <canvas id="minimap" width="220" height="220" aria-hidden="true"></canvas>

    <div id="help-backdrop"></div>
    <div id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
        <div class="help-modal-header">
            <div>
                <div class="help-kicker">操作ガイド</div>
                <h2 id="help-title">操作説明</h2>
            </div>
            <button id="help-close-button" type="button" aria-label="閉じる">×</button>
        </div>
        <p id="help-summary"></p>
        <ul id="help-action-list" class="help-action-list"></ul>
    </div>

    <div id="dashboard-shell">
        <section id="story-panel" class="panel-shell hidden">
            <div class="panel-shell-header">
                <div class="shell-kicker">LIFE ARCHIVE PROJECT</div>
                <h2 class="shell-title">キセキ・カサネテ</h2>
                <p class="shell-subtitle">移動ログを俯瞰するためのビューです。</p>
            </div>
        </section>

        <div id="playback-controls" class="hidden">
            <div class="player-wrapper">
                <button id="play-pause-btn">⏸</button>
                <input type="range" id="seek-bar" min="0" max="100" value="0" step="1">
                <div id="time-display">--/--/-- --:--</div>
            </div>
            <div id="stats-header" class="stats-row">
                <div class="stat-item">
                    <span class="stat-label">総移動距離</span>
                    <div id="ui-total-dist" class="stat-value">0 <span class="stat-unit">km</span></div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">到達都道府県</span>
                    <div class="stat-value"><span id="visited-prefecture-count">0</span><span class="stat-unit"> / <span id="prefecture-total-count">--</span></span></div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">現在日時</span>
                    <div id="dashboard-date" class="stat-value">--/--/-- --:--</div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">進捗</span>
                    <div id="dashboard-progress" class="stat-value">0%</div>
                </div>
            </div>
        </div>

        <aside id="side-panel" class="hidden">
            <div class="panel-section">
                <h3>カメラモード</h3>
                <div class="camera-mode-row">
                    <button id="camera-mode-follow" class="camera-mode-btn">フォロー (中心)</button>
                    <button id="camera-mode-free" class="camera-mode-btn active">フリービュー</button>
                </div>
            </div>

            <div id="layer-controls" class="panel-section">
                <h3>時間レイヤー</h3>
                <label class="toggle-row">
                    <input type="checkbox" id="toggle-hs" checked>
                    <span class="color-dot" style="background: #ff0044;"></span> 高校
                </label>
                <label class="toggle-row">
                    <input type="checkbox" id="toggle-u1" checked>
                    <span class="color-dot" style="background: #00d2ff;"></span> 大学1年
                </label>
                <label class="toggle-row">
                    <input type="checkbox" id="toggle-u2" checked>
                    <span class="color-dot" style="background: #7fd36a;"></span> 大学2年
                </label>
                <label class="toggle-row">
                    <input type="checkbox" id="toggle-u3" checked>
                    <span class="color-dot" style="background: #b36bff;"></span> 大学3年
                </label>
            </div>

            <div class="panel-section">
                <h3>再生速度</h3>
                <div class="playback-speed playback-speed-panel">
                    <label for="playback-speed-slider">速度</label>
                    <input type="range" id="playback-speed-slider" min="0.25" max="4.0" step="0.25" value="1.0">
                    <span id="playback-speed-value">1.0x</span>
                </div>
            </div>
        </aside>
    </div>

    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="main.js"></script>
    <script src="trajectory-loader.js"></script>
</body>
</html>
